[package]
description = "A database compatible with MongoDB Wire Protocol that uses PostgreSQL for backend storage."
edition = "2021"
name = "oxide"
version = "0.2.1"

[features]
default = []
shell = ["dep:rquickjs", "dep:rustyline", "dep:mongodb", "dep:ctrlc", "dep:dirs", "dep:base64", "dep:tokio", "dep:tree-sitter", "dep:tree-sitter-javascript"]
web = ["dep:axum", "dep:tokio"]

[dependencies]
tree-sitter = {version = "0.25", optional = true}
tree-sitter-javascript = {version = "0.25", optional = true}
rquickjs = {version = "0.14", features = ["macro"], optional = true}
rustyline = {version = "17", optional = true}
mongodb = {version = "3", features = ["bson-2"], optional = true}
ctrlc = {version = "3", optional = true}
dirs = {version = "6", optional = true}
base64 = {version = "0.22", optional = true}
axum = {version = "0.8", optional = true}
tokio = {version = "1", features = ["rt", "time", "net", "sync", "macros"], optional = true}
bson = {version = "2.4.0", features = ["chrono-0_4"]}
byteorder = "1.4.3"
crc32c = "0.6.8"
clap = {version = "4", features = ["derive"]}
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
eyre = "0.6"
postgres-protocol = "0.6"
postgres = {version = "0.19", features = ["with-serde_json-1"]}
r2d2 = "0.8.10"
r2d2_postgres = "0.18.1"
regex = "1"
sha2 = "0.10"
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1", features = ["preserve_order"]}

[dev-dependencies]
chrono = "0.4"
indoc = "1.0.6"
mongodb = {version = "3", features = ["sync", "bson-2"]}

[dev-dependencies.uuid]
features = [
  "v4", # Lets you generate random UUIDs
  "fast-rng", # Use a faster (but still sufficiently random) RNG
  "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]
version = "1.1.2"

[dev-dependencies.tower]
version = "0.5"
features = ["util"]
