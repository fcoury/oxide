name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to validate (must already exist when publishing)
        required: true
        type: string
      verify:
    needs: [prepare, compatibility, package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify all three native packages
        shell: python
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          import glob, hashlib, os, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['RELEASE_COMMIT'], 'Unexpected package verification checkout'
          if os.environ['PUBLISH'] == 'true':
              tagged = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + os.environ['RELEASE_TAG'] + '^{commit}'], text=True).strip()
              assert tagged == commit, 'Release tag moved after validation'
          archives = sorted(glob.glob('dist/*.tar.gz'))
          assert len(archives) == 3, 'Expected tested Linux, native macOS, and native Windows packages'
          for archive in archives:
              expected, filename = open(archive + '.sha256sum').read().strip().split(maxsplit=1)
              assert filename.removeprefix('*') == os.path.basename(archive)
              with open(archive, 'rb') as source:
                  actual = hashlib.sha256(source.read()).hexdigest()
              assert actual == expected, 'Package checksum mismatch'
              print('Verified ' + archive + ': ' + actual)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error
  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist
      - name: Publish the verified release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          import glob, json, os, subprocess
          tag = os.environ['RELEASE_TAG']
          commit = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          assert commit == os.environ['RELEASE_COMMIT'], 'Release tag moved after validation'
          files = sorted(glob.glob('dist/*'))
          exists = subprocess.run(['gh', 'release', 'view', tag], capture_output=True).returncode == 0
          if exists:
              release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft'], text=True))
              assert release['isDraft'], 'Refusing to replace an already published release'
              subprocess.run(['gh', 'release', 'upload', tag, *files, '--clobber'], check=True)
              subprocess.run(['gh', 'release', 'edit', tag, '--draft=false'], check=True)
          else:
              command = ['gh', 'release', 'create', tag, '--verify-tag', '--title', tag, '--generate-notes', *files]
              if '-' in tag:
                  command.append('--prerelease')
              subprocess.run(command, check=True)
