name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching Cargo.toml (created after validation when publishing)
        required: true
        type: string
      publish:
        description: Publish after validation (false builds and tests only)
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
      release-pr:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup show
      - name: Validate the release bot credential without making changes
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push')" = true
      - name: Resolve release mode
        id: mode
        env:
          PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.publish }}
        run: echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Validate version and resolve exact candidate
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py prepare --tag "$RELEASE_TAG"
  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
  compatibility:
    needs: [prepare, checks]
    uses: ./.github/workflows/upstream-compatibility.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      mode: baseline
  package:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-release
      - name: Build native artifact
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          ./scripts/package "$target"
      - name: Exercise the extracted release executable
        run: python scripts/smoke-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
  verify:
    needs: [prepare, compatibility, package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: upstream-report
          path: target/release-upstream
      - name: Verify platforms, checksums and exact tested Linux package
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python3 scripts/release.py verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --report target/release-upstream/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error
  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: upstream-report
          path: target/release-upstream
      - name: Publish only verified assets and classify the release explicitly
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_PR: ${{ inputs.release-pr }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --pr "$RELEASE_PR" --report target/release-upstream/results.json
